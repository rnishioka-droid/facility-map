<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>施設マップ</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.Default.css">
<script src="https://unpkg.com/leaflet.markercluster/dist/leaflet.markercluster.js"></script>

<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

<style>
html,body{height:100%;margin:0;}
#map{position:absolute;top:0;bottom:0;width:100%;}

#filter{
  position:absolute;top:12px;left:12px;z-index:1000;
  width:272px;padding:14px;
  background:rgba(255,255,255,0.96);
  border-radius:10px;
  box-shadow:0 2px 12px rgba(0,0,0,0.2);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:13px;
  box-sizing:border-box;
}

#address{width:100%;height:32px;padding:5px 8px;box-sizing:border-box;}
.search-options{display:flex;align-items:center;gap:7px;margin:10px 0;}
.search-options select{height:30px;}
#mode{width:88px;}
#distance{width:62px;}
.circle-row{display:flex;align-items:center;margin-bottom:10px;}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px 10px;
  padding:10px 0;
  border-top:1px solid #ddd;
  border-bottom:1px solid #ddd;
}

.grid label{display:flex;align-items:center;white-space:nowrap;line-height:1.2;}
.grid input{margin:0 4px 0 0;}

.color-dot{
  display:inline-block;
  flex:none;
  width:10px;
  height:10px;
  border-radius:50%;
  margin-right:5px;
}

.custom-pin{
  position:relative;
  width:24px;
  height:24px;
  border:2px solid #fff;
  border-radius:50% 50% 50% 0;
  box-shadow:0 1px 4px rgba(0,0,0,0.55);
  transform:rotate(-45deg);
}

.custom-pin::after{
  content:"";
  position:absolute;
  width:8px;
  height:8px;
  top:6px;
  left:6px;
  background:#fff;
  border-radius:50%;
}

.buttons{display:flex;gap:5px;margin-top:10px;}
.buttons button{height:30px;padding:0 8px;cursor:pointer;}
.buttons button:disabled{cursor:wait;opacity:0.65;}
#count{margin-top:8px;font-weight:bold;}
#status{margin-top:4px;color:#555;line-height:1.35;}
</style>
</head>

<body>

<div id="map"></div>

<div id="filter">

<input id="address" placeholder="住所 or 駅">

<div class="search-options">
  <select id="mode" onchange="updateDistanceOptions()">
    <option value="distance">距離</option>
    <option value="walk">徒歩</option>
    <option value="drive">車</option>
    <option value="train">電車</option>
  </select>

  <select id="distance"></select>
  <span id="unit">km</span>
</div>

<label class="circle-row">
  <input type="checkbox" id="circleToggle" checked> 円表示
</label>

<div class="grid">
  <label><span class="color-dot" style="background:red"></span><input type="checkbox" value="特養" checked>特養</label>
  <label><span class="color-dot" style="background:blue"></span><input type="checkbox" value="老健" checked>老健</label>

  <label><span class="color-dot" style="background:green"></span><input type="checkbox" value="有料" checked>有料</label>
  <label><span class="color-dot" style="background:orange"></span><input type="checkbox" value="サ高住" checked>サ高住</label>

  <label><span class="color-dot" style="background:violet"></span><input type="checkbox" value="GH" checked>GH</label>
  <label><span class="color-dot" style="background:grey"></span><input type="checkbox" value="デイ" checked>デイ</label>

  <label><span class="color-dot" style="background:black"></span><input type="checkbox" value="病院" checked>病院</label>
  <label><span class="color-dot" style="background:green"></span><input type="checkbox" value="訪問介護" checked>訪問介護</label>

  <label><span class="color-dot" style="background:#c99700"></span><input type="checkbox" value="保育所（認可）" checked>保育所（認可）</label>
  <div></div>

  <label><span class="color-dot" style="background:#38a9db"></span><input type="checkbox" value="認証保育所A" checked>認証保育所A</label>
  <label><span class="color-dot" style="background:#e83e8c"></span><input type="checkbox" value="認証保育所B" checked>認証保育所B</label>
</div>

<div class="buttons">
  <button onclick="search()">検索</button>
  <button onclick="exportFaxCSV()">FAX用CSV</button>
  <button onclick="exportDetailCSV()">確認用CSV</button>
</div>

<div id="count">件数:0</div>
<div id="status"></div>

</div>

<script>
const map = L.map("map").setView([35.735,139.715],13);

L.tileLayer(
  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png"
).addTo(map);

const markers = L.markerClusterGroup().addTo(map);
const allMarkers = [];

let currentResults = [];
let centerLat = 0;
let centerLng = 0;
let centerMarker = null;
let currentCircle = null;
let latestSearchId = 0;
let isSearching = false;

const walkDurationCache = new Map();
const WALK_TABLE_ENDPOINT =
  "https://routing.openstreetmap.de/routed-foot/table/v1/foot/";
const WALK_TABLE_CHUNK_SIZE = 40;
const WALK_REQUEST_INTERVAL_MS = 1100;
const WALK_PREFILTER_KM_PER_MINUTE = 0.14;

function updateDistanceOptions(){
  const mode = document.getElementById("mode").value;
  const select = document.getElementById("distance");
  const unit = document.getElementById("unit");

  select.innerHTML = "";

  if(mode === "distance"){
    unit.innerText = "km";

    [1,3,5,10,15,20,25,30].forEach(value => {
      const option = new Option(value,value);

      if(value === 5){
        option.selected = true;
      }

      select.add(option);
    });
  }else if(mode === "walk"){
    unit.innerText = "分";

    [10,20,30].forEach(value => {
      const option = new Option(value,value);

      if(value === 10){
        option.selected = true;
      }

      select.add(option);
    });
  }else{
    unit.innerText = "分";

    for(let value = 5; value <= 60; value += 5){
      const option = new Option(value,value);

      if(value === 30){
        option.selected = true;
      }

      select.add(option);
    }
  }
}

updateDistanceOptions();

function getColor(category){
  if(!category){
    return "blue";
  }

  category = category.replace(/\s/g,"");

  if(category === "認証保育所A") return "#38a9db";
  if(category === "認証保育所B") return "#e83e8c";
  if(category.includes("保育所（認可）")) return "gold";
  if(category.includes("特養")) return "red";
  if(category.includes("老健")) return "blue";
  if(category.includes("有料")) return "green";
  if(category.includes("サ高住")) return "orange";
  if(category.includes("GH")) return "violet";
  if(category.includes("デイ")) return "grey";
  if(category.includes("病院")) return "black";
  if(category.includes("訪問介護")) return "green";

  return "blue";
}

function createIcon(color){
  return L.divIcon({
    className:"",
    html:`<div class="custom-pin" style="background:${color}"></div>`,
    iconSize:[28,28],
    iconAnchor:[14,28],
    popupAnchor:[0,-30]
  });
}

function getPopupHtml(marker,walkMinutes = null){
  const row = marker.data;
  const url = row.url
    ? `<a href="${row.url}" target="_blank">サイト</a>`
    : "";
  const walkText = Number.isFinite(walkMinutes)
    ? `駅から徒歩:約${Math.round(walkMinutes)}分<br>`
    : "";

  return `<b>${row.name}</b><br>
    区分:${marker.category}<br>
    会社:${row.company}<br>
    住所:${row.address}<br>
    ${walkText}
    TEL:${row.phone}<br>
    FAX:${row.fax}<br>
    ${url}`;
}

function updateMarkerPopup(marker,walkMinutes = null){
  marker.bindPopup(getPopupHtml(marker,walkMinutes));
}

function setLoading(active,message = ""){
  isSearching = active;

  document
    .querySelectorAll(".buttons button")
    .forEach(button => {
      button.disabled = active;
    });

  document.getElementById("status").innerText = message;
}

function delay(ms){
  return new Promise(resolve => setTimeout(resolve,ms));
}

function getWalkPrefilterDistanceKm(limitMinutes){
  return Math.max(1.5,limitMinutes * WALK_PREFILTER_KM_PER_MINUTE);
}

function getCoordKey(lat,lng){
  return `${lat.toFixed(5)},${lng.toFixed(5)}`;
}

function getWalkCacheKey(marker){
  return [
    getCoordKey(centerLat,centerLng),
    getCoordKey(marker.lat,marker.lng)
  ].join("->");
}

async function fetchWalkingDurations(markersChunk){
  const coordinates = [
    `${centerLng},${centerLat}`,
    ...markersChunk.map(marker => `${marker.lng},${marker.lat}`)
  ].join(";");

  const response = await fetch(
    WALK_TABLE_ENDPOINT +
    coordinates +
    "?sources=0&annotations=duration"
  );

  if(!response.ok){
    throw new Error("徒歩ルートAPIから応答を取得できません");
  }

  const data = await response.json();

  if(data.code !== "Ok" || !data.durations || !data.durations[0]){
    throw new Error("徒歩ルートAPIで所要時間を取得できません");
  }

  return data.durations[0].slice(1);
}

async function filterByWalkingTime(candidates,limitMinutes,searchId){
  const uncachedMarkers = [];

  candidates.forEach(marker => {
    const cacheKey = getWalkCacheKey(marker);

    if(walkDurationCache.has(cacheKey)){
      marker.walkMinutes = walkDurationCache.get(cacheKey);
      return;
    }

    marker.walkMinutes = null;
    uncachedMarkers.push(marker);
  });

  for(
    let index = 0;
    index < uncachedMarkers.length;
    index += WALK_TABLE_CHUNK_SIZE
  ){
    if(searchId !== latestSearchId){
      return null;
    }

    const chunk = uncachedMarkers.slice(
      index,
      index + WALK_TABLE_CHUNK_SIZE
    );

    document.getElementById("status").innerText =
      `徒歩ルート取得中 ${Math.min(index + chunk.length,uncachedMarkers.length)}` +
      `/${uncachedMarkers.length}`;

    const durations = await fetchWalkingDurations(chunk);

    chunk.forEach((marker,chunkIndex) => {
      const durationSeconds = durations[chunkIndex];
      const walkMinutes = Number.isFinite(durationSeconds)
        ? durationSeconds / 60
        : null;

      marker.walkMinutes = walkMinutes;
      walkDurationCache.set(getWalkCacheKey(marker),walkMinutes);
    });

    if(index + WALK_TABLE_CHUNK_SIZE < uncachedMarkers.length){
      await delay(WALK_REQUEST_INTERVAL_MS);
    }
  }

  return candidates.filter(marker =>
    Number.isFinite(marker.walkMinutes) &&
    marker.walkMinutes <= limitMinutes
  );
}

function isCategoryMatch(markerCategory,checkedCategory){
  const marker = String(markerCategory || "").replace(/\s/g,"");
  const checked = String(checkedCategory || "").replace(/\s/g,"");

  if(checked === "認証保育所A" || checked === "認証保育所B"){
    return marker === checked;
  }

  return marker.includes(checked);
}

function getDistance(lat1,lng1,lat2,lng2){
  const radius = 6371;
  const latDifference = (lat2-lat1) * Math.PI / 180;
  const lngDifference = (lng2-lng1) * Math.PI / 180;

  const value =
    Math.sin(latDifference/2) ** 2 +
    Math.cos(lat1*Math.PI/180) *
    Math.cos(lat2*Math.PI/180) *
    Math.sin(lngDifference/2) ** 2;

  return radius * 2 * Math.atan2(
    Math.sqrt(value),
    Math.sqrt(1-value)
  );
}

Papa.parse("data.csv",{
  download:true,
  header:true,
  skipEmptyLines:true,

  complete:function(result){
    result.data.forEach(row => {
      const lat = parseFloat(row.lat);
      const lng = parseFloat(row.lng);
      const category = row.category || "";

      if(isNaN(lat) || isNaN(lng)){
        return;
      }

      const marker = L.marker([lat,lng],{
        icon:createIcon(getColor(category))
      });

      marker.lat = lat;
      marker.lng = lng;
      marker.category = category;
      marker.data = row;
      marker.walkMinutes = null;

      updateMarkerPopup(marker);

      allMarkers.push(marker);
    });
  }
});

async function search(){
  if(isSearching){
    return;
  }

  const searchId = ++latestSearchId;
  const address = document.getElementById("address").value.trim();
  const limit = parseFloat(document.getElementById("distance").value);
  const mode = document.getElementById("mode").value;
  const showCircle = document.getElementById("circleToggle").checked;

  if(!address){
    alert("住所または駅を入力してください");
    return;
  }

  setLoading(true,"検索地点を取得中...");

  try{
    const response = await fetch(
      "https://nominatim.openstreetmap.org/search?format=json&limit=1&q=" +
      encodeURIComponent(address)
    );

    const data = await response.json();

    if(searchId !== latestSearchId){
      return;
    }

    if(!data.length){
      alert("見つからない");
      return;
    }

    centerLat = parseFloat(data[0].lat);
    centerLng = parseFloat(data[0].lon);

    map.setView([centerLat,centerLng],13);

    if(centerMarker){
      map.removeLayer(centerMarker);
    }

    centerMarker = L.marker([centerLat,centerLng],{
      icon:createIcon("red")
    })
    .addTo(map)
    .bindPopup("検索地点")
    .openPopup();

    if(currentCircle){
      map.removeLayer(currentCircle);
      currentCircle = null;
    }

    if(showCircle && mode === "distance"){
      currentCircle = L.circle([centerLat,centerLng],{
        radius:limit * 1000,
        color:"blue",
        fillOpacity:0.1
      }).addTo(map);
    }

    markers.clearLayers();
    currentResults = [];

    const checkedCategories = [
      ...document.querySelectorAll(".grid input:checked")
    ].map(element => element.value);

    const candidates = [];

    allMarkers.forEach(marker => {
      let isWithinRange = false;

      const distance = getDistance(
        centerLat,
        centerLng,
        marker.lat,
        marker.lng
      );

      if(mode === "distance"){
        isWithinRange = distance <= limit;
      }

      if(mode === "walk"){
        isWithinRange = distance <= getWalkPrefilterDistanceKm(limit);
      }

      if(mode === "drive"){
        isWithinRange = distance * 2 <= limit;
      }

      if(mode === "train"){
        isWithinRange = distance * 3 <= limit;
      }

      const categoryMatches = checkedCategories.some(category =>
        isCategoryMatch(marker.category,category)
      );

      if(isWithinRange && categoryMatches){
        candidates.push(marker);
      }
    });

    let results = candidates;

    if(mode === "walk"){
      document.getElementById("status").innerText =
        `候補施設 ${candidates.length}件の徒歩時間を確認中...`;
      results = await filterByWalkingTime(candidates,limit,searchId);

      if(results === null){
        return;
      }
    }

    if(searchId !== latestSearchId){
      return;
    }

    results.forEach(marker => {
      updateMarkerPopup(
        marker,
        mode === "walk" ? marker.walkMinutes : null
      );
      markers.addLayer(marker);
      currentResults.push(marker);
    });

    document.getElementById("count").innerText =
      "件数:" + currentResults.length;
    document.getElementById("status").innerText = "";
  }catch(error){
    if(searchId === latestSearchId){
      alert(error.message);
      document.getElementById("count").innerText = "件数:0";
      document.getElementById("status").innerText =
        mode === "walk"
          ? "徒歩ルートを取得できませんでした"
          : "";
    }
  }finally{
    if(searchId === latestSearchId){
      isSearching = false;
      document
        .querySelectorAll(".buttons button")
        .forEach(button => {
          button.disabled = false;
        });
    }
  }
}

function escapeCSV(value){
  const text = String(value ?? "").replace(/"/g,'""');
  return `"${text}"`;
}

function downloadCSV(csv,filename){
  const blob = new Blob(["\uFEFF" + csv],{
    type:"text/csv;charset=utf-8;"
  });

  const link = document.createElement("a");
  const url = URL.createObjectURL(blob);

  link.href = url;
  link.download = filename;
  link.click();

  URL.revokeObjectURL(url);
}

function exportFaxCSV(){
  let csv = "name,category,company,fax,distance_km\n";

  currentResults.forEach(marker => {
    const row = marker.data;

    const distance = getDistance(
      centerLat,
      centerLng,
      marker.lat,
      marker.lng
    ).toFixed(2);

    if(row.fax){
      csv += [
        escapeCSV(row.name),
        escapeCSV(marker.category),
        escapeCSV(row.company),
        escapeCSV(row.fax),
        escapeCSV(distance)
      ].join(",") + "\n";
    }
  });

  downloadCSV(csv,"fax.csv");
}

function exportDetailCSV(){
  let csv = "name,category,company,phone,fax,distance_km\n";

  currentResults.forEach(marker => {
    const row = marker.data;

    const distance = getDistance(
      centerLat,
      centerLng,
      marker.lat,
      marker.lng
    ).toFixed(2);

    csv += [
      escapeCSV(row.name),
      escapeCSV(marker.category),
      escapeCSV(row.company),
      escapeCSV(row.phone),
      escapeCSV(row.fax),
      escapeCSV(distance)
    ].join(",") + "\n";
  });

  downloadCSV(csv,"detail.csv");
}
</script>

</body>
</html>
